name: Check

on:
  push:
    branches: [main, phase-4-meta]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The added QA matrix measures 392 cases after a 2.5-second settle each.
    # Existing per-test timeouts and native-input performance limits are unchanged.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - webkit-ipad
          - chromium-android
          - chromium-whiteboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Cross-check TypeScript and Python solvability
        run: |
          npm run validate:content
          python3 tools/build_levels.py --check
          npm run validate:cross-check
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Keep the existing required-check name while each browser gets its own runner.
  # The expanded regression suite retains every project, assertion and timeout.
  check:
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.e2e.result }}' = success
